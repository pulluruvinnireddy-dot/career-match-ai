spring.application.name=career-match-ai
server.port=8080

# Telegram Bot Configuration
# Bot token will be read from environment variable TELEGRAM_BOT_TOKEN or configured here
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:CareerMatchAIBot}

# Temporarily exclude DataSource & JPA auto-configurations until Phase 9 (MySQL setup)
spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.jdbc.autoconfigure.DataSourceInitializationAutoConfiguration,\
  org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
